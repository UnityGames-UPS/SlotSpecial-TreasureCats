name: Trigger S3 Upload

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  call-reusable:
    uses: UnityGames-UPS/unity-build-pipeline/.github/workflows/br.yml@main
    secrets: inherit
    with:
      s3_bucket: unity.build-prod
      s3_folder: SL-TC
      cloudfront_distribution_id: E1SPDAO62CBV8F
      invalidate_paths: "/SL-TC/*"
